name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project files
        run: flutter create --org com.itzluxurious --project-name kirana_calculator --platforms=android .
      - name: Android setup (internet, app name)
        run: |
          python3 - <<'PY'
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f).read()
          s = s.replace('android:label="kirana_calculator"', 'android:label="Kirana Kata"')
          s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          open(f, 'w').write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
      - name: App icon
        run: |
          if [ -f icon.png ]; then
            python3 -c "import PIL" 2>/dev/null || pip install --break-system-packages pillow || pip install pillow
            python3 - <<'PY'
          from PIL import Image, ImageDraw
          src = Image.open('icon.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for k, sz in sizes.items():
              im = src.resize((sz, sz), Image.LANCZOS)
              mask = Image.new('L', (sz * 4, sz * 4), 0)
              ImageDraw.Draw(mask).rounded_rectangle((0, 0, sz * 4 - 1, sz * 4 - 1), radius=int(sz * 4 * 0.22), fill=255)
              im.putalpha(mask.resize((sz, sz), Image.LANCZOS))
              im.save('android/app/src/main/res/mipmap-%s/ic_launcher.png' % k)
          print('icon done')
          PY
          else
            echo "icon.png not found, using default icon"
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kirana-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch test on emulator (shows crash log)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb install build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.itzluxurious.kirana_calculator -c android.intent.category.LAUNCHER 1
            sleep 20
            echo ===== APP STATUS =====
            adb shell pidof com.itzluxurious.kirana_calculator || echo APP-NOT-RUNNING-CRASHED
            echo ===== CRASH LOG =====
            adb logcat -d -b crash | head -60
