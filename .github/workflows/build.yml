name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project files
        run: flutter create --org com.itzluxurious --project-name kirana_calculator --platforms=android .
      - name: Android setup (internet, app name)
        run: |
          python3 - <<'PY'
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f).read()
          s = s.replace('android:label="kirana_calculator"', 'android:label="Kirana Calculator"')
          s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          open(f, 'w').write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kirana-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch test on emulator (shows crash log)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb install build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.itzluxurious.kirana_calculator -c android.intent.category.LAUNCHER 1
            sleep 20
            echo ===== APP STATUS =====
            adb shell pidof com.itzluxurious.kirana_calculator || echo APP-NOT-RUNNING-CRASHED
            echo ===== CRASH LOG =====
            adb logcat -d -b crash | head -60
